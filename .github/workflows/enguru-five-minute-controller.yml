name: ENGURU Five Minute Controller
on:
  pull_request:
    paths: ['tools/enguru_five_minute_controller.py','tests/test_enguru_five_minute_controller.py','governance/controller/**','.github/workflows/enguru-five-minute-controller.yml']
  push:
    branches: [main]
    paths: ['tools/enguru_five_minute_controller.py','tests/test_enguru_five_minute_controller.py','governance/controller/**','.github/workflows/enguru-five-minute-controller.yml']
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: enguru-five-minute-controller-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'worker' }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Regression verification
        run: python3 -m unittest discover -s tests -p 'test_enguru_five_minute_controller.py' -v
      - name: PR bounded pilot
        if: github.event_name == 'pull_request'
        run: python3 tools/enguru_five_minute_controller.py --pilot --root . --worklist governance/controller/TASKS.json --gate governance/controller/ACTIVATION.json --output /tmp/enguru-controller-pilot.json
  worker:
    needs: verify
    if: ${{ always() && github.event_name != 'pull_request' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Perform one governed task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/enguru_five_minute_controller.py --root . --worklist governance/controller/TASKS.json --gate governance/controller/ACTIVATION.json --output /tmp/enguru-controller.json
