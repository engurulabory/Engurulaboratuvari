name: ENGURU Management V6.9 Review
on:
  pull_request:
    paths:
      - 'tools/enguru_management_v69.py'
      - 'tools/enguru_management_v69_source_adapter.py'
      - 'tests/test_enguru_management_v69_source_adapter.py'
      - 'tools/enguru_management_v69_*.py'
      - 'tests/test_enguru_management_v69_*.py'
      - 'tests/test_enguru_management_v69.py'
      - 'governance/management-v69/**'
      - '.github/workflows/enguru-management-v69.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      actions: read
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Management adversarial tests
        run: python3 -m unittest discover -s tests -p 'test_enguru_management_v69.py' -v
      - name: Source-bound snapshot tests
        run: python3 -m unittest discover -s tests -p 'test_enguru_management_v69_source.py' -v
      - name: Read actual controller snapshot (no execution)
        run: python3 tools/enguru_management_v69_source.py --root . --source-commit "$(git rev-parse HEAD)"
      - name: Crosswalk authority and false-CI adversarial tests
        run: python3 -m unittest discover -s tests -p 'test_enguru_management_v69_evidence.py' -v
      - name: Task ID evidence crosswalk (read-only)
        run: python3 tools/enguru_management_v69_evidence.py --root . --ledger governance/management-v69/EVIDENCE_CROSSWALK.json
      - name: Operational receipt negative tests
        run: python3 -m unittest discover -s tests -p 'test_enguru_management_v69_operation.py' -v
      - name: Source-bound historical receipt classification
        run: python3 tools/enguru_management_v69_operation.py
      - name: Live GitHub provenance verification (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/enguru_management_v69_operation.py --live \
            --output "$RUNNER_TEMP/enguru-management-v69-live-evidence.json"
          sha256sum "$RUNNER_TEMP/enguru-management-v69-live-evidence.json"
      - name: Preserve management evidence
        uses: actions/upload-artifact@v4
        with:
          name: enguru-management-v69-live-evidence
          path: ${{ runner.temp }}/enguru-management-v69-live-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: No-write management example
        run: python3 tools/enguru_management_v69.py --worklist governance/management-v69/EXAMPLE_TASKS.json
      - name: Real source adapter tests
        run: python3 -m unittest discover -s tests -p 'test_enguru_management_v69_source_adapter.py' -v
      - name: Read-only real controller reconciliation
        run: |
          python3 tools/enguru_management_v69_source_adapter.py \
            --tasks governance/controller/TASKS.json \
            --gate governance/controller/ACTIVATION.json \
            --source-ref "github-pr-checkout" \
            --source-commit "$(git rev-parse HEAD)"
