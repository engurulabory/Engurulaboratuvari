name: ENGURU OSi Muhendislik Kasi - reviewed evidence intake

on:
  pull_request:
    paths:
      - 'tools/enguru_muhendislik_kasi.py'
      - 'tools/enguru_mk_five_minute_watch.py'
      - 'tests/test_enguru_muhendislik_kasi.py'
      - 'tests/test_enguru_mk_five_minute_watch.py'
      - 'tests/test_enguru_mk_contract_v3.py'
      - 'tools/enguru_mk_acceptance_v3.py'
      - 'tools/pilive_learning_adapter_v1.py'
      - 'tests/test_pilive_learning_adapter_v1.py'
      - 'tools/pilive_native_learning_probe_v1.py'
      - 'tests/test_pilive_native_learning_probe_v1.py'
      - 'governance/pilive-learning/**'
      - '.github/workflows/enguru-muhendislik-kasi.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  unit-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Triple simulation of learning + five-minute watcher
        run: |
          for cycle in 1 2 3; do
            echo "SIMULATION_CYCLE=$cycle"
            python -m unittest discover -s tests -p 'test_enguru_muhendislik_kasi.py' -v
            python -m unittest discover -s tests -p 'test_enguru_mk_five_minute_watch.py' -v
            python -m unittest discover -s tests -p 'test_enguru_mk_contract_v3.py' -v
            python -m unittest discover -s tests -p 'test_pilive_learning_adapter_v1.py' -v
            python -m unittest discover -s tests -p 'test_pilive_native_learning_probe_v1.py' -v
          done

  owner-comment-intake:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.issue.number == 203 || github.event.issue.number == 206) &&
      github.event.sender.login == github.repository_owner &&
      github.event.sender.type != 'Bot' &&
      contains(github.event.comment.body, '```enguru-mk-event')
    runs-on: ubuntu-latest
    concurrency:
      group: enguru-mk-review-branch
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      ENGURU_MK_OWNER_LOGIN: ${{ github.repository_owner }}
    steps:
      - name: Checkout isolated learning branch
        uses: actions/checkout@v4
        with:
          ref: docs/enguru-osi-muhendislik-kasi-20261023
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate regression first
        run: |
          python -m unittest discover -s tests -p 'test_enguru_muhendislik_kasi.py' -q
          python -m unittest discover -s tests -p 'test_enguru_mk_five_minute_watch.py' -q
          python -m unittest discover -s tests -p 'test_enguru_mk_contract_v3.py' -q
      - name: Enforce two-round 25-gate engineering contract with 20 percent reserve
        run: python tools/enguru_mk_acceptance_v3.py
      - name: Validate owner-submitted structured evidence as review candidate
        run: |
          python tools/enguru_muhendislik_kasi.py \
            --record governance/enguru-suzgeci/ENGURU_OSI_MUHENDISLIK_KASI_CANLI_KAYIT_V1.md \
            --github-event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/candidate-record.md" \
            --receipt "$RUNNER_TEMP/enguru-mk-receipt.json"
      - name: Write to isolated learning branch only
        run: |
          cp "$RUNNER_TEMP/candidate-record.md" governance/enguru-suzgeci/ENGURU_OSI_MUHENDISLIK_KASI_CANLI_KAYIT_V1.md
          git add -- governance/enguru-suzgeci/ENGURU_OSI_MUHENDISLIK_KASI_CANLI_KAYIT_V1.md
          if git diff --cached --quiet; then
            echo 'STATE=IDEMPOTENT_NO_DELTA'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: ingest owner evidence into ENGURU learning review branch'
          git push origin HEAD:refs/heads/docs/enguru-osi-muhendislik-kasi-20261023

  five-minute-github-observer:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: enguru-mk-review-branch
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ENGURU_MK_OWNER_LOGIN: ${{ github.repository_owner }}
    steps:
      - name: Checkout persistent learning review branch
        uses: actions/checkout@v4
        with:
          ref: docs/enguru-osi-muhendislik-kasi-20261023
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce two-round engineering acceptance before reading live events
        run: python tools/enguru_mk_acceptance_v3.py
      - name: Read GitHub sources and safely classify changes
        run: |
          python tools/enguru_mk_five_minute_watch.py \
            --record governance/enguru-suzgeci/ENGURU_OSI_MUHENDISLIK_KASI_CANLI_KAYIT_V1.md \
            --checkpoint governance/enguru-suzgeci/learning/MK_WATCH_CHECKPOINT.json
      - name: Commit only factual learning files when changed
        run: |
          git add -- \
            governance/enguru-suzgeci/ENGURU_OSI_MUHENDISLIK_KASI_CANLI_KAYIT_V1.md \
            governance/enguru-suzgeci/learning/MK_WATCH_CHECKPOINT.json
          if git diff --cached --quiet; then
            echo 'STATE=PASS_NO_NEW_EVIDENCE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: capture new GitHub and OSi evidence in ENGURU learning record'
          git push origin HEAD:refs/heads/docs/enguru-osi-muhendislik-kasi-20261023
