name: ENGURU V69 Integrated V3 Pinned Source
on:
  pull_request:
    paths:
      - 'governance/management-v69/handoff/integrated-v3/**'
      - '.github/workflows/enguru-v69-integrated-v3.yml'
  workflow_dispatch:
jobs:
  integrated-v3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cryptographic test dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Exact pinned sources are present
        run: python governance/management-v69/handoff/integrated-v3/preflight.py
      - name: Execute real module entrypoints
        run: python governance/management-v69/handoff/integrated-v3/runner.py --run /tmp/enguru-v69-v3
      - name: Independently validate receipts
        run: python governance/management-v69/handoff/integrated-v3/runner.py --verify /tmp/enguru-v69-v3
