name: ENGURU Zulfikar V141 Five Real Task Families
on:
  pull_request:
    paths:
      - 'tools/zulfikar-performance-v141/**'
      - 'governance/enguru-suzgeci/zulfikar-v12/v141/**'
      - '.github/workflows/enguru-zulfikar-performance.yml'
permissions:
  contents: read
  actions: read
jobs:
  preserved-source-scope:
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.scope.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Reuse only unchanged campaign sources for the owner-approved contract change
        run: |
          if [ -f tools/zulfikar-performance-v141/verify_personal_acceptance.py ]; then
            echo "reuse=$(python3 -B tools/zulfikar-performance-v141/verify_personal_acceptance.py --classify)" >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi
  personal-use-technical-acceptance:
    needs: preserved-source-scope
    if: needs.preserved-source-scope.outputs.reuse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing preparation locks and current 18-file source seal
        run: |
          python3 -B tools/zulfikar-performance-v141/check_preparation.py
          python3 -B governance/enguru-suzgeci/zulfikar-v12/v141/verify_github_source_seal_v2.py
      - name: Reconcile real retained outputs SHA manifests and existing DoneCheck results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ENGINE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -B tools/zulfikar-performance-v141/verify_personal_acceptance.py --verify
      - name: Preserve personal-use technical receipt and original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zulfikar-personal-use-technical-acceptance
          path: evidence/personal-use/
          if-no-files-found: error
          retention-days: 90
  real-task-repair-recovery:
    needs: preserved-source-scope
    if: needs.preserved-source-scope.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: T01 T02 frozen preparation and canonical byte locks
        run: python3 -B tools/zulfikar-performance-v141/check_preparation.py
      - name: Current source seal 18 files
        run: python3 -B governance/enguru-suzgeci/zulfikar-v12/v141/verify_github_source_seal_v2.py
      - name: Eight replay and checkpoint counterexamples
        run: python3 -B tools/zulfikar-performance-v141/test_replay_regressions.py
      - name: Five real tasks each with baseline fault and repair phases
        run: |
          mkdir -p evidence/performance
          git rev-parse HEAD > evidence/performance/source-commit.txt
          for round in 1 2 3; do
            python3 -B tools/zulfikar-performance-v141/run_campaign.py "evidence/performance/round-$round"
            python3 -B tools/zulfikar-performance-v141/verify_campaign.py "evidence/performance/round-$round"
          done
      - name: Second exam checkpoint race and truthful process proof
        run: python3 -B tools/zulfikar-performance-v141/second-exam/test_engine_race.py
      - name: Three existing source software tasks with actual patches regression and replay
        run: |
          python3 -B tools/zulfikar-performance-v141/second-exam/run_real_work.py evidence/second-exam
          git rev-parse HEAD > evidence/second-exam/source-commit.txt
          python3 -B tools/zulfikar-performance-v141/second-exam/verify_package.py evidence/second-exam
      - name: Package actual existing-source task evidence
        if: always()
        run: python3 -B tools/zulfikar-performance-v141/second-exam/package_evidence.py evidence/second-exam evidence/second-exam-evidence.zip
      - name: Preserve second real source task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zulfikar-second-existing-source-evidence
          path: evidence/second-exam-evidence.zip
          retention-days: 30
      - name: Preserve actual task outputs and independent mechanism receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zulfikar-five-real-task-evidence
          path: evidence/performance/
          retention-days: 30
      - name: Three actual engine-only counter-review rounds
        run: |
          mkdir -p evidence/engine-final
          python3 -B -m unittest discover -s governance/enguru-suzgeci/zulfikar-v12/v141/dom -p 'test_proof_chain.py' -v > evidence/engine-final/round-1-source.log 2>&1
          python3 -B tools/zulfikar-performance-v141/second-exam/test_engine_race.py > evidence/engine-final/round-2-resilience.log 2>&1
          python3 -B -m unittest discover -s governance/enguru-suzgeci/zulfikar-v12/v141/dom -p 'test_completion_guard.py' -v > evidence/engine-final/round-3-finish.log 2>&1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read exact existing DoneCheck v1.2 core
        uses: actions/checkout@v5
        with:
          repository: engurulabory/donecheck
          ref: 4181f48df5ea0c060d9aa9f40a471c554b44b53d
          path: donecheck-v12
          persist-credentials: false
      - name: Prepare existing DoneCheck runtime in disposable runner directory
        run: |
          mkdir -p "$RUNNER_TEMP/zulfikar-donecheck-build"
          cp -R donecheck-v12/src "$RUNNER_TEMP/zulfikar-donecheck-build/src"
          cd "$RUNNER_TEMP/zulfikar-donecheck-build"
          npm init -y >/dev/null
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund zod@3.25.76 esbuild@0.25.12
          ./node_modules/.bin/esbuild src/donecheck-core.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/zulfikar-donecheck-core.mjs"
      - name: Real DoneCheck for the engine's own technical and full acceptance task
        env:
          EXPECTED_ENGINE_HEAD: ${{ github.event.pull_request.head.sha }}
          DONECHECK_CORE_BUNDLE: ${{ runner.temp }}/zulfikar-donecheck-core.mjs
        run: node tools/zulfikar-performance-v141/verify_engine_donecheck.mjs
      - name: Preserve engine-only three rounds and actual DoneCheck result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zulfikar-engine-final-donecheck
          path: evidence/engine-final/
          if-no-files-found: error
          retention-days: 90
