name: ENGURU Zulfikar V141 E00 Experience Learning
on:
  pull_request:
    paths:
      - 'governance/enguru-suzgeci/zulfikar-e00-learning-v141/**'
      - '.github/workflows/enguru-zulfikar-v141-e00-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-e00-real-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve original V1.4.1 DÖM code identity
        run: |
          test "$(git hash-object governance/enguru-suzgeci/zulfikar-v12/v141/dom/engine.py)" = '90ab6ce53f73546be6c04ff7ee1cee7531bd3721'
          git diff --exit-code
      - name: Three isolated runs with actual subprocess and negative controls
        run: |
          mkdir -p e00-ci-evidence
          for round in 1 2 3; do
            python3 -B -m unittest discover \
              -s governance/enguru-suzgeci/zulfikar-e00-learning-v141 \
              -p 'test_experience_learning.py' -v > "e00-ci-evidence/round-${round}.log" 2>&1
            grep -q 'Ran 18 tests' "e00-ci-evidence/round-${round}.log"
            grep -q 'OK' "e00-ci-evidence/round-${round}.log"
            tail -n 4 "e00-ci-evidence/round-${round}.log"
          done
      - name: Exact source identity and limited receipt
        run: |
          git rev-parse HEAD > e00-ci-evidence/head-sha.txt
          sha256sum governance/enguru-suzgeci/zulfikar-e00-learning-v141/experience_learning.py > e00-ci-evidence/module-sha256.txt
          sha256sum governance/enguru-suzgeci/zulfikar-e00-learning-v141/test_experience_learning.py > e00-ci-evidence/tests-sha256.txt
          printf '%s\n' 'E00_GITHUB_ISOLATED_TEST=PASS' 'PRODUCT_VERIFIED_FINISH=HOLD' 'MAC_OSI_FIELD=NOT_TESTED' > e00-ci-evidence/scope.txt
      - name: Save exact-head E00 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enguru-zulfikar-v141-e00-ci-evidence
          path: e00-ci-evidence/
          if-no-files-found: warn
          retention-days: 30
