name: IP Model Trust Fleet

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fleet-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ENGURU Fleet Gate
        run: python tools/fleet_ip_gate.py
