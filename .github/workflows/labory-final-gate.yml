name: ENGURU Labory Final Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  labory-final-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System truth / order / simplicity
        run: python tools/labory_final_gate.py

      - name: Shared AI static foundation gate
        run: python tools/shared_ai_foundation_gate.py

      - name: Shared AI deterministic offline tests
        run: python -m unittest discover -s tests -p 'test_shared_ai_offline.py' -v

      - name: Shared AI runtime tests
        run: python -m unittest discover -s tests -p 'test_shared_ai_runtime.py' -v

      - name: Shared AI behavior tests
        run: python -m unittest discover -s tests -p 'test_shared_ai_behavior.py' -v

      - name: Mac Engineer Package 3 persistent working memory tests
        run: python -m unittest discover -s tests -p 'test_working_memory.py' -v

      - name: Mac Engineer Package 3 Mandatory DoneCheck
        run: python tools/package3_working_memory_donecheck.py

      - name: Mac Engineer Package 4 field acceptance tests
        run: python -m unittest discover -s tests -p 'test_field_acceptance.py' -v

      - name: Mac Engineer Package 4 Mandatory DoneCheck
        run: python tools/package4_field_acceptance_donecheck.py

      - name: Mac Engineer Package 5 aggregate closeout tests
        run: python -m unittest discover -s tests -p 'test_package5_closeout.py' -v

      - name: Mac Engineer Package 5 final Mandatory DoneCheck
        run: python tools/package5_v06_donecheck.py

      - name: Mac Engineer Package 6 commissioning contract tests
        run: python -m unittest discover -s tests -p 'test_mac_local_commissioning.py' -v

      - name: Mac Engineer Package 6 provenance tool syntax
        run: python -m py_compile tools/mac_engineer_runtime_provenance.py tools/mac_engineering_prepare_real_task.py tools/mac_engineering_refresh_real_task_runtime.py tools/mac_engineering_repo_discovery_diagnostic.py

      - name: Mac Engineer Package 6 provenance reconciliation syntax
        run: python -m py_compile tools/mac_engineer_provenance_reconcile.py

      - name: Mac Engineer Package 6 source intake review syntax
        run: python -m py_compile tools/mac_engineer_source_intake_review.py

      - name: Mac Engineer Package 6 delta authority review syntax
        run: python -m py_compile tools/mac_engineer_delta_authority_review.py

      - name: Mac Engineer clean operating system syntax
        run: python -m py_compile tools/mac_engineer_control.py tools/mac_engineer_bootstrap_product_source.py tools/mac_engineer_layout_audit.py tools/mac_engineer_session_continuity.py tools/mac_engineer_product_ci_verify.py tools/mac_engineer_rebuild_install_preflight.py tools/mac_engineer_prepare_v06_alignment.py tools/mac_engineer_publish_v06_alignment.py tools/mac_engineer_merge_v06_alignment.py tools/mac_engineer_exact_sha_rebuild_install.py tools/mac_engineering_sync_context.py

      - name: Mac Engineer product source bootstrap tests
        run: python -m unittest discover -s tests -p 'test_mac_engineer_product_source_bootstrap.py' -v

      - name: Mac Engineer layout audit tests
        run: python -m unittest discover -s tests -p 'test_mac_engineer_layout_audit.py' -v

      - name: Mac Engineer session continuity tests
        run: python -m unittest discover -s tests -p 'test_mac_engineer_session_continuity.py' -v

      - name: Mac Engineer product CI verifier tests
        run: python -m unittest discover -s tests -p 'test_mac_engineer_product_ci_verify.py' -v

      - name: Mac Engineer rebuild install preflight tests
        run: python -m unittest discover -s tests -p 'test_mac_engineer_rebuild_install_preflight.py' -v

      - name: Mac Engineer v0.6 alignment preparation tests
        run: python -m unittest discover -s tests -p 'test_mac_engineer_prepare_v06_alignment.py' -v

      - name: Mac Engineer v0.6 alignment publication tests
        run: python -m unittest discover -s tests -p 'test_mac_engineer_publish_v06_alignment.py' -v

      - name: Mac Engineer v0.6 alignment merge gate tests
        run: python -m unittest discover -s tests -p 'test_mac_engineer_merge_v06_alignment.py' -v

      - name: Mac Engineer exact-SHA rebuild install tests
        run: python -m unittest discover -s tests -p 'test_mac_engineer_exact_sha_rebuild_install.py' -v

      - name: Mac Engineering canonical context tests
        run: python -m unittest discover -s tests -p 'test_mac_engineering_canonical_context.py' -v

      - name: Mac Engineering runtime provenance closure tests
        run: python -m unittest discover -s tests -p 'test_mac_engineering_runtime_provenance.py' -v

      - name: Mac Engineering real task preparation tests
        run: python -m unittest discover -s tests -p 'test_mac_engineering_prepare_real_task.py' -v

      - name: Mac Engineering real task runtime refresh tests
        run: python -m unittest discover -s tests -p 'test_mac_engineering_refresh_real_task_runtime.py' -v

      - name: Mac Engineering repo discovery diagnostic tests
        run: python -m unittest discover -s tests -p 'test_mac_engineering_repo_discovery_diagnostic.py' -v

      - name: Quality & Red Team review tests
        run: python -m unittest discover -s tests -p 'test_quality_review.py' -v

      - name: Jev System-One experiment gate tests
        run: python -m unittest discover -s tests -p 'test_jev_experiment.py' -v

      - name: Security & Authority review tests
        run: python -m unittest discover -s tests -p 'test_security_review.py' -v

      - name: Verified production discipline tests
        run: python -m unittest discover -s tests -p 'test_production_discipline.py' -v

      - name: Release quality adapter tests
        run: python -m unittest discover -s tests -p 'test_release_quality.py' -v

      - name: Shared AI runtime smoke
        shell: bash
        run: |
          python -m shared_ai.http_server &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/shared-ai-health.json; then
              break
            fi
            sleep 0.25
          done
          python - <<'PY'
          import json
          with open('/tmp/shared-ai-health.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data["state"] == "PASS", data
          assert data["runtime"] == "UP", data
          print(json.dumps(data, ensure_ascii=False))
          PY

      - name: IP & Model Trust tests
        run: python -m unittest discover -s tests -p 'test_ip_model_trust_gate.py' -v

      - name: Capability & Agent Authority adversarial tests
        run: python -m unittest discover -s tests -p 'test_capability_agent_authority_gate.py' -v

      - name: ENGURU Billing Core tests
        run: python -m unittest discover -s tests -p 'test_billing_core.py' -v

      - name: PARK adapter mock tests
        run: python -m unittest discover -s tests -p 'test_park_mock.py' -v

      - name: ENGURU Billing v1 tests
        run: python -m unittest discover -s tests -p 'test_billing_v1.py' -v

      - name: Billing persistent store tests
        run: python -m unittest discover -s tests -p 'test_billing_persistent_store.py' -v

      - name: Monthly Maya billing mail tests
        run: python -m unittest discover -s tests -p 'test_monthly_maya_mail.py' -v

      - name: Secret Zero / Fleet Gate v1.2
        run: python tools/fleet_ip_gate.py

      - name: Repository Steward v1.1 tests
        run: node steward/tests.mjs

      - name: Repository Steward scheduled runner smoke
        run: node steward/run-scheduled-cycle.mjs

      - name: Final state
        run: echo 'ENGURU LABORY REPOSITORY FINAL GATE = PASS' >> "$GITHUB_STEP_SUMMARY"

  gh69-base-exact-head:
    name: GH69-BASE exact-HEAD canonical and adversarial verification
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'feat/enguru-gh69-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD and canonical V3 locked evidence
        shell: bash
        env:
          EXPECTED_GH69_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_GH69_HEAD"
          test -f tests/test_enguru_management_v69_foundation.py
          test -f governance/mac-engineer/ENGURU_MANAGEMENT_V69_FOUNDATION_ACCEPTANCE_V1.json
          test -f governance/enguru-suzgeci/ENGURU_EVRENSEL_KANITLI_TAMAMLAMA_TALIMATI_V3.md
          python3 -B tools/verify_enguru_universal_v3_lock.py
          python3 -B -m unittest discover -s tests -p 'test_enguru_universal_v3_lock.py' -v
      - name: GH69-BASE exact-head 38 tests (all executed)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_enguru_management_v69_foundation.py' -v 2>&1 | tee /tmp/gh69-base-tests.log
          grep -Eq '^Ran 38 tests in ' /tmp/gh69-base-tests.log
          if grep -Eqi 'skipped=[1-9]' /tmp/gh69-base-tests.log; then
            echo 'STATE=HOLD_GH69_TEST_SKIPPED'
            exit 61
          fi
          echo 'STATE=PASS_GH69_EXACT_HEAD_TESTS'
      - name: GH69 WP02-WP03 scoped attestation and ledger adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/test_enguru_management_v69_wp02_wp03_bridge.mjs 2>&1 | tee /tmp/gh69-wp02-wp03-test.log
          grep -Eq '^# tests 44$' /tmp/gh69-wp02-wp03-test.log
          grep -Eq '^# pass 44$' /tmp/gh69-wp02-wp03-test.log
          grep -Eq '^# fail 0$' /tmp/gh69-wp02-wp03-test.log
          grep -Eq '^# skipped 0$' /tmp/gh69-wp02-wp03-test.log
      - name: Checkout bounded read-only original PR191 ledger SHA
        uses: actions/checkout@v4
        with:
          ref: de63a9e34a9b05b6474c847019d8c682b5360d50
          path: .gh69-pr191-evidence
          persist-credentials: false
          sparse-checkout: |
            governance/mac-engineer/progress/ENGURU_100_BIRIM_FINIS_SAYACI_V1.json
          sparse-checkout-cone-mode: false
      - name: GH69 WP02-WP03 live pinned ledger and external trust HOLD
        shell: bash
        run: |
          set -euo pipefail
          node tools/enguru_management_v69_wp02_wp03_bridge.mjs .gh69-pr191-evidence/governance/mac-engineer/progress/ENGURU_100_BIRIM_FINIS_SAYACI_V1.json > /tmp/gh69-wp02-wp03-real-ledger.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/gh69-wp02-wp03-real-ledger.json').read_text())
          assert x['state']=='HOLD_EXTERNAL_TRUST_ROOT', x
          assert x['verifiedUnits']==27, x
          assert x['officialPassAdded']==0 and x['verifiedFinish'] is False, x
          assert x['ledgerBlobSha1']=='d54f48ce532a23e4e4b6eff1ef5f9c7c776e71fc',x
          print('STATE=PASS_REAL_LEDGER_OBSERVED_EXTERNAL_AUTHORITY_SAFE_HOLD')
          PY

      - name: GH69 WP04-WP05 bounded journal 28 adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/test_enguru_management_v69_wp04_wp05_runtime.mjs 2>&1 | tee /tmp/gh69-wp0405-tests.log
          grep -Eq '^# tests 28$' /tmp/gh69-wp0405-tests.log
          grep -Eq '^# pass 28$' /tmp/gh69-wp0405-tests.log
          grep -Eq '^# fail 0$' /tmp/gh69-wp0405-tests.log
          grep -Eq '^# skipped 0$' /tmp/gh69-wp0405-tests.log
      - name: GH69 WP04-WP05 actual pinned-ledger management-execution restart
        shell: bash
        env:
          GH69_DISPOSABLE_ROOT: /tmp/gh69-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node tools/enguru_management_v69_wp04_wp05_runtime.mjs --pilot \
            .gh69-pr191-evidence/governance/mac-engineer/progress/ENGURU_100_BIRIM_FINIS_SAYACI_V1.json \
            "$GH69_DISPOSABLE_ROOT" > /tmp/gh69-wp0405-first.json
          node tools/enguru_management_v69_wp04_wp05_runtime.mjs --pilot \
            .gh69-pr191-evidence/governance/mac-engineer/progress/ENGURU_100_BIRIM_FINIS_SAYACI_V1.json \
            "$GH69_DISPOSABLE_ROOT" > /tmp/gh69-wp0405-restart.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/gh69-wp0405-first.json').read_text())
          b=json.loads(Path('/tmp/gh69-wp0405-restart.json').read_text())
          for x in (a,b):
              assert x['state']=='PASS_REAL_BOUNDED_HANDOFF_EXTERNAL_AUTHORITY_HOLD',x
              assert x['taskId']=='ENGURU-MGMT69-GH-FOUNDATION-01',x
              assert x['events']==7 and x['finalState']=='HOLD_EXTERNAL_AUTHORITY',x
              assert x['officialPassAdded']==0 and x['verifiedFinish'] is False,x
              assert x['sourceLedgerBlob']=='d54f48ce532a23e4e4b6eff1ef5f9c7c776e71fc',x
              assert x['donecheck']=='HOLD' and x['humanThreshold']=='PRESERVED',x
          assert a['head']==b['head'],(a,b)
          print('STATE=PASS_REAL_PINNED_LEDGER_DISPOSABLE_HANDOFF_RESTART_SAFE_HOLD')
          PY
      - name: GH69 WP02-WP05 source and handoff binder tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/test_enguru_management_v69_wp02_wp05_source_binding.mjs 2>&1 | tee /tmp/gh69-binder-tests.log
          grep -Eq '^# tests 29$' /tmp/gh69-binder-tests.log
          grep -Eq '^# pass 29$' /tmp/gh69-binder-tests.log
          grep -Eq '^# fail 0$' /tmp/gh69-binder-tests.log
          grep -Eq '^# skipped 0$' /tmp/gh69-binder-tests.log
      - name: Checkout pinned DoneCheck v1.2 source
        uses: actions/checkout@v4
        with:
          repository: engurulabory/donecheck
          ref: 4181f48df5ea0c060d9aa9f40a471c554b44b53d
          path: .gh69-donecheck-source
          persist-credentials: false
      - name: GH69 WP02-WP05 real original-ledger durable handoff and DoneCheck source
        shell: bash
        env:
          GH69_DISPOSABLE_ROOT: /tmp/gh69-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node tools/enguru_management_v69_wp02_wp05_source_binding.mjs --readonly \
            .gh69-pr191-evidence/governance/mac-engineer/progress/ENGURU_100_BIRIM_FINIS_SAYACI_V1.json \
            "$GH69_DISPOSABLE_ROOT" .gh69-donecheck-source > /tmp/gh69-binder-real.json || { cat /tmp/gh69-binder-real.json; exit 2; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/gh69-binder-real.json').read_text())
          assert x['state']=='PASS_REAL_PINNED_SOURCE_AND_HANDOFF_EXTERNAL_AUTHORITY_HOLD',x
          assert x['donecheckHead']=='4181f48df5ea0c060d9aa9f40a471c554b44b53d',x
          assert x['ledgerBlob']=='d54f48ce532a23e4e4b6eff1ef5f9c7c776e71fc',x
          assert x['events']==7 and len(x['donecheckBlobs'])==4,x
          assert x['officialPassAdded']==0 and x['verifiedFinish'] is False,x
          assert x['donecheckRuntimeInvoked'] is False,x
          assert x['trustRoot'].startswith('HOLD_'),x
          print('STATE=PASS_REAL_BOUND_SOURCE_AND_HANDOFF_OFFICIAL_AUTHORITY_HOLD')
          PY
