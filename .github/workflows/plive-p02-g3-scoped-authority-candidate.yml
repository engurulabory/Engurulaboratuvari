name: PLive P02 G3 Scoped Authority Candidate
on:
  push:
    branches:
      - feat/plive-p02-g3-authority-binding-review-20261020
  pull_request:
permissions:
  contents: read
jobs:
  scoped-authorization-negative-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scope and signature adversarial tests
        run: python -B -m unittest discover -s tests -p 'test_plive_p02_g3_scoped_grant_verify_v1.py' -v
      - name: P02 pinned canonical source binding adversarial tests
        run: python -B -m unittest discover -s tests -p 'test_plive_p02_g3_canonical_source_binding_v1.py' -v
      - name: Mac G3-A metadata qualification offline negatives
        run: python -B -m unittest discover -s tests -p 'test_plive_p02_g3a_native_signer_metadata_readonly_v1.py' -v
      - name: Preserve real-field authority boundary
        run: echo 'Candidate code never issues an issuer/grant, writes canonical state, or authorizes P02 PASS.'

  pinned-g3a-app-build:
    name: G3A pinned Swift app-like build (authority HOLD)
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Mac signer exact Swift source SHA-256
        shell: bash
        run: |
          python3 -c 'import hashlib,pathlib; p=pathlib.Path("tools/plive_p02_g3a_signer_main_v1.swift"); actual=hashlib.sha256(p.read_bytes()).hexdigest(); expected="b4dae8d509b5e434cccc60324c4eed6fd4373a7e0db7791de3e9bc719736a2f4"; print("SWIFT_SOURCE_SHA256="+actual); assert actual == expected, "HOLD_SOURCE_DRIFT"'
      - name: Compile ARM64 app-like signer (no signing or key use)
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ENGURU-G3A-Signer.app"
          mkdir -p "$APP/Contents/MacOS"
          xcrun swiftc -target arm64-apple-macos13.0 tools/plive_p02_g3a_signer_main_v1.swift -o "$APP/Contents/MacOS/enguru-g3a-signer"
          test -s "$APP/Contents/MacOS/enguru-g3a-signer"
          file "$APP/Contents/MacOS/enguru-g3a-signer"
          echo 'STATE=PASS_PINNED_SWIFT_APP_BUILD_ONLY'
          echo 'NATIVE_G3A_AUTHORITY=HOLD NO_KEYCHAIN_EXECUTION=TRUE P02_WRITES=0'
