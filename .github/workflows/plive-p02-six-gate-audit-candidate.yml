name: PLive P02 Six Gate Integrated Audit Candidate
on:
  push:
    branches:
      - feat/plive-p02-g3-authority-binding-review-20261020
  pull_request:
    paths:
      - 'tools/plive_p02_integrated_six_gate_audit_v1.py'
      - 'tests/test_plive_p02_integrated_six_gate_audit_v1.py'
      - '.github/workflows/plive-p02-six-gate-audit-candidate.yml'
jobs:
  six-gate-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline adversarial audit tests
        run: python -B -m unittest discover -s tests -p 'test_plive_p02_integrated_six_gate_audit_v1.py' -v
