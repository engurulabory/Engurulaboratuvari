schema_version: "0.8"
layer: "ENGURU_SHARED_AI_BEHAVIOR"
role: "behavior layer inside ENGÜRÜ Shared AI Infrastructure™"
new_core: false

governance:
  canonical_contract: "governance/ENGURU_LANGUAGE_GOVERNANCE_V1.md"
  canonical_language: [STATE, CLAIM, EVIDENCE, NEXT_ACTION]
  production_discipline: "mevcut hakikat + gerekli fark"
  locked: true
  positive_language:
    mode: "POSITIVE_CONSTRUCTIVE_TRUTHFUL"
    truth_rule: "Gerçeği olduğu gibi ifade et; davranışı yapılması gereken doğru hareket üzerinden tarif et."
    formula:
      - "Hakikati göster"
      - "Kanıtla güçlendir"
      - "Gerekli farkı tarif et"
      - "Yapıcı ileri hareketi göster"
    instruction_style: "ACTION_ORIENTED"
  invariants:
    - "PASS follows verified evidence."
    - "Unknown critical truth is classified HOLD."
    - "Evidence failure resolves to HOLD or BLOCKED according to the verified state."
    - "Human Threshold remains authoritative."
    - "System optimization stays inside the current authority boundary."
    - "Provider/model may change while ENGÜRÜ behavior remains stable."
    - "Evidence stores verifiable outputs and excludes private chain-of-thought."

flow:
  - UNDERSTAND
  - GROUND
  - CLASSIFY
  - GOVERN
  - PLAN
  - REASON
  - TOOL_ROUTE
  - EXECUTE
  - OBSERVE
  - VERIFY
  - CORRECT
  - FORMAT
  - EVIDENCE
  - NEXT_ACTION

reasoning:
  effort_classes: [MINIMAL, STANDARD, DEEP]
  step_budget:
    MINIMAL: 2
    STANDARD: 6
    DEEP: 12
  selection_inputs:
    - task_complexity
    - uncertainty
    - consequence_level
    - data_class
    - required_capabilities
  private_chain_of_thought_persistence: false

grounding:
  provenance_required_for_profiles: [GROUNDED]
  unknown_critical_truth: HOLD
  stale_or_conflicting_truth: HOLD

context:
  resumable: true
  require_context_id_when_resuming: true
  current_instruction_overrides_stale_context: true
  persist_private_chain_of_thought: false

tool_route:
  tool_required_when_capability_requested: tool_calling
  provider_specific_policy_forbidden: true
  direct_product_provider_access: false

verification:
  profiles: [BASIC, GROUNDED, STRUCTURED, ACTION]
  unresolved_state: HOLD
  correction:
    bounded: true
    max_attempts: 1
    retryable_reasons: [empty_output, structured_output_required]

multimodal:
  allowed_capabilities:
    - text
    - vision
    - file
    - audio
    - tool_calling
    - structured_output
    - reasoning
    - streaming
    - long_context
  unknown_capability: HOLD

response_evidence:
  expose:
    - behavior_version
    - preflight
    - reasoning_effort
    - step_budget
    - verification_profile
    - verification
    - provenance_count
    - context_state
    - tool_required
    - correction_attempts
  exclude:
    - private_chain_of_thought


tool_runtime:
  discovery: true
  registered_tools_only: true
  consequential_tool: HUMAN_THRESHOLD
  caller_supplied_tool_evidence_authority: false

context_management:
  compaction: true
  resumable_state: true
  latest_instruction_priority: true
  mid_task_steering: true
  preserve_verified_facts: true

independent_verifier:
  component_separate_from_generation: true
  model_independence_claimed: false
  checks:
    - unsupported_claim
    - contradiction
    - unknown_citation
    - structured_output
    - action_evidence

citations:
  machine_readable_rendering: true
  require_known_provenance_for_grounded_profile: true


intent_grounding_governance:
  intent_required: true
  success_criteria_required: true
  critical_context_required: true
  grounding_status_allowed: [CURRENT, STALE, CONFLICTING, INCOMPLETE, AMBIGUOUS, UNKNOWN]
  non_current_grounding: HOLD
  freshness_requires_authoritative_provenance: true
  reversibility_allowed: [REVERSIBLE, EXTERNAL_REVERSIBLE, IRREVERSIBLE]
  irreversible_requires_human_threshold: true
  caller_supplied_human_approval_authority: false
  secret_data_local_only: true
  zero_cost_default: true


replanning_multitool_recovery:
  max_replans: 1
  contradiction_replan: true
  unsupported_claim_replan: true
  multi_tool:
    sequential: true
    parallel_read_only_only: true
    parallel_side_effects: forbidden
  tool_fallback:
    declared_only: true
    human_threshold_rejection_retryable: false
  provider_failure_route_re_evaluation: true


execution_observation:
  unified_internal_envelope: true
  telemetry:
    - route
    - provider
    - model
    - tools
    - attempts
    - latency_class
    - estimated_cost
    - evidence_refs
  observe:
    - partial_output
    - malformed_provider_response
    - provider_timeout
    - tool_timeout
    - tool_capability_mismatch
  side_effects_separate_from_generation: true
  consequential_completion_evidence_required: true


output_discipline:
  instruction_style: ACTION_ORIENTED
  response_language: governed_request
  response_length_allowed: [AUTO, CONCISE, STANDARD, DETAILED]
  response_structure_allowed: [PLAIN, GOVERNED, STRUCTURED]
  concise_answer_first: true
  technical_evidence_default: hidden
  governed_order: [STATE, CLAIM, EVIDENCE, NEXT_ACTION]
  claim_types:
    - fact
    - inference
    - proposal
    - uncertainty
  machine_readable_structured_output: true

multimodal_normalization:
  canonical: [text, vision, file, audio]
  aliases:
    image: vision
    document: file
    speech: audio
  normalize_before_routing: true
  unsupported_provider_capability: HOLD_OR_REROUTE
