schema_version: "0.1"
service: "ENGURU_SHARED_AI_INFRASTRUCTURE"
authority: "ENGÜRÜ Labory Control Plane"
mode: "provider_independent"
request:
  required:
    - request_id
    - task_type
    - data_class
    - required_capabilities
    - cost_ceiling
  fields:
    request_id: {type: string}
    task_type: {type: string}
    data_class:
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, SECRET]
    required_capabilities:
      type: array
      items: [text, vision, file, audio, tool_calling, structured_output, reasoning, streaming, long_context]
    cost_ceiling:
      type: number
      minimum: 0
      default: 0
    context_tokens_estimate: {type: integer, minimum: 0}
    latency_class:
      enum: [BEST_EFFORT, INTERACTIVE, BATCH]
    verification_profile:
      enum: [BASIC, GROUNDED, STRUCTURED, ACTION]
    consequence_level:
      enum: [LOW, MEDIUM, HIGH]
    uncertainty: {type: number, minimum: 0, maximum: 1}
    provenance:
      type: array
      items: {type: string}
    context_id: {type: string}
    resume_from: {type: string}
    context_messages:
      type: array
      items: {type: string}
    steering_instruction: {type: string}
    requested_tool: {type: string}
    tool_input: {type: object}
    response_language: {type: string, default: AUTO}
    response_length:
      enum: [AUTO, CONCISE, STANDARD, DETAILED]
    response_structure:
      enum: [PLAIN, GOVERNED, STRUCTURED]
    include_technical_evidence: {type: boolean, default: false}
response:
  required:
    - request_id
    - state
    - output
    - route_evidence
    - verification
  state:
    enum: [PASS, HOLD, BLOCKED]
  route_evidence:
    required: [provider, model, policy_verdict, attempts, estimated_cost]
  behavior_evidence:
    fields:
      - behavior_version
      - preflight
      - reasoning_effort
      - step_budget
      - verification_profile
      - verification
      - provenance_count
      - context_state
      - tool_required
      - correction_attempts
rules:
  - "Products use the provider-independent service contract."
  - "Provider-specific features stay isolated behind adapters and capability checks."
  - "Unknown critical metadata is classified HOLD."
  - "Cost ceiling is verified before execution."
  - "SECRET data uses LOCAL_ONLY by default."

language_governance:
  canonical_contract: "governance/ENGURU_LANGUAGE_GOVERNANCE_V1.md"
  principle: "mevcut hakikat + gerekli fark"
  mode: "POSITIVE_CONSTRUCTIVE_TRUTHFUL"
  instruction_style: "ACTION_ORIENTED"
  truth_rule: "Gerçeği olduğu gibi ifade et; davranışı yapılması gereken doğru hareket üzerinden tarif et."


frontier_response:
  citations:
    type: array
    item_fields: [index, ref]
  tool_evidence:
    type: array
    authority: "runtime-generated only; caller-supplied tool evidence is ignored"


execution_evidence:
  fields:
    - state
    - source_type
    - source_name
    - model
    - tools
    - route
    - attempts
    - latency_class
    - estimated_cost
    - evidence_refs
    - observations
    - side_effect_state
    - completion_evidence
  rules:
    - "Consequential side effects close with runtime-generated completion evidence."
    - "Side-effect completion state remains authoritative independently of text generation."


output_discipline:
  governed_order: [state, claim, evidence, next_action]
  typed_claims: [facts, inferences, proposals, uncertainties]
  technical_evidence_opt_in: true
  structured_output_machine_readable: true
